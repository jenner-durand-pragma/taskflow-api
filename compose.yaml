services:
  postgres:
    image: 'postgres:${POSTGRES_VERSION}'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    ports:
      - '${POSTGRES_HOST_PORT}:5432'

  kafka:
    image: 'apache/kafka:${KAFKA_VERSION}'
    ports:
      - '${KAFKA_EXTERNAL_PORT}:9092'
    volumes:
      - ./jaas.conf:/etc/kafka/jaas.conf
    environment:
      # Controller and Nodes
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER

      # Network
      - KAFKA_LISTENERS=EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=${KAFKA_ADVERTISED_EXTERNAL},INTERNAL://kafka:29092

      # Security
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=EXTERNAL:SASL_PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL

      # Config
      - KAFKA_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_OPTS=-Djava.security.auth.login.config=/etc/kafka/jaas.conf

      # Coordinator
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

  kafdrop:
    image: 'obsidiandynamics/kafdrop:${KAFDROP_VERSION}'
    depends_on:
      - kafka
    ports:
      - '${KAFDROP_HOST_PORT}:9000'
    environment:
      - KAFKA_BROKERCONNECT=kafka:29092