services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=taskflow_db'
      - 'POSTGRES_PASSWORD=taskflow_password'
      - 'POSTGRES_USER=taskflow_user'
    ports:
      - '5432:5432'
  kafka:
    image: 'apache/kafka:latest' # <-- Esta es la clave
    ports:
      - '9092:9092'
    environment:
    - KAFKA_NODE_ID=1
    - KAFKA_PROCESS_ROLES=broker,controller
    - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
    - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
    # AQUI ESTA LA MAGIA:
    # Puerta EXTERNAL (9092) para tu PC/ngrok. Puerta INTERNAL (29092) para Docker/Kafdrop
    - KAFKA_LISTENERS=EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
    - KAFKA_ADVERTISED_LISTENERS=EXTERNAL://localhost:9092,INTERNAL://kafka:29092
    - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL

  kafdrop:
    image: 'obsidiandynamics/kafdrop:latest'
    depends_on:
      - kafka
    ports:
      - '9000:9000'
    environment:
      - KAFKA_BROKERCONNECT=kafka:29092